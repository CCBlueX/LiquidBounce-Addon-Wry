[package]
name = "wry-probe"
version = "0.1.0"
edition = "2021"
publish = false

# Phase 1 feasibility probe: hosts a Wry webview off-screen and measures how its pixels can reach a
# GPU texture on each OS. Not part of the add-on.

[dependencies]
wry = "0.57"
png = "0.17"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
x11-dl = "2"
raw-window-handle = "0.6"
libc = "0.2"
cairo = { version = "0.18", package = "cairo-rs" }
glib = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-numerics = "0.3"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = false
