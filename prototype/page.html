<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: sans-serif; }
  /* Solid corner the probes sample to check that real page pixels arrived */
  #marker { position: absolute; left: 0; top: 0; width: 64px; height: 64px; background: rgb(255, 0, 0); }
  #panel {
    position: absolute; left: 50%; top: 50%; width: 600px; height: 320px; margin: -160px 0 0 -300px;
    background: rgba(20, 20, 40, 0.6); backdrop-filter: blur(12px); border-radius: 16px; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 42px;
  }
  #spinner {
    position: absolute; left: 100px; top: 300px; width: 120px; height: 120px;
    background: linear-gradient(45deg, #4a90e2, #e24a90); border-radius: 12px;
  }
</style>
</head>
<body>
<div id="marker"></div>
<div id="spinner"></div>
<div id="panel">0 fps</div>
<!-- Targets for the input checks: a click on the field, typing, then a click on the button -->
<input id="text" style="position: absolute; left: 40px; top: 700px; width: 300px; height: 40px; font-size: 24px">
<button id="button" style="position: absolute; left: 40px; top: 600px; width: 200px; height: 60px">Click</button>
<script>
  // Animates every frame and reports the page's own frame rate in the title
  const spinner = document.getElementById('spinner');
  const panel = document.getElementById('panel');
  const text = document.getElementById('text');
  let frames = 0, last = performance.now(), fps = 0, clicks = 0;
  const report = () => document.title = `fps=${fps};clicks=${clicks};text=${text.value}`;
  document.getElementById('button').addEventListener('click', () => { clicks++; report(); });
  text.addEventListener('input', report);
  function tick(now) {
    frames++;
    spinner.style.transform = `translateX(${(now / 4) % 1200}px) rotate(${now / 5}deg)`;
    if (now - last >= 1000) {
      fps = Math.round(frames * 1000 / (now - last));
      panel.textContent = fps + ' fps';
      report();
      frames = 0; last = now;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
