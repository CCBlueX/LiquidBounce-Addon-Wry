name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so older distributions can load the library
          - platform: linux-x64
            os: ubuntu-22.04
            library: libliquidbounce_wry.so
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            library: libliquidbounce_wry.so
          - platform: windows-x64
            os: windows-2025
            library: liquidbounce_wry.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxkbcommon-dev
      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.platform }}
      - name: Build
        run: cargo build --release --locked
      - name: Self-test
        run: |
          set -o pipefail
          limit() { if command -v timeout >/dev/null; then timeout "$@"; else perl -e 'alarm shift; exec @ARGV' "$@"; fi; }
          mkdir -p selftest
          limit 300 target/release/selftest selftest 2>&1 | tee selftest/log.txt
      - name: Collect library
        run: |
          mkdir -p ../natives/${{ matrix.platform }}
          cp target/release/${{ matrix.library }} ../natives/${{ matrix.platform }}/
      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.platform }}
          path: natives/
      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-${{ matrix.platform }}
          path: native/selftest/
          if-no-files-found: ignore

  build:
    needs: natives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setting up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Download libraries
        uses: actions/download-artifact@v7
        with:
          pattern: natives-*
          path: natives
          merge-multiple: true
      - name: Build
        run: ./gradlew build -Pnatives=natives
      - name: Check libraries in the jar
        run: |
          set -euo pipefail
          JAR=$(find build/libs -name '*.jar' -not -name '*-sources.jar' | head -n1)
          unzip -l "$JAR" | grep 'natives/'
          [ "$(unzip -l "$JAR" | grep -c 'natives/.*liquidbounce_wry')" = "$(find natives -type f | wc -l)" ]

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: addon
          path: build/libs/*.jar

      - name: Publish snapshot release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          JAR=$(find build/libs -name '*.jar' -not -name '*-sources.jar' | head -n1)
          [ -n "$JAR" ] || { echo "[ERROR] no jar in build/libs" >&2; exit 1; }

          NOTES="Automatic build of \`${GITHUB_SHA::7}\` from \`main\`.

          Not a stable release - it tracks whatever is on main right now."

          # Recreate rather than edit: `gh release upload --clobber` cannot retarget the tag when
          # main has moved on.
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot "$JAR" \
            --title "Snapshot" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Attach jar to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          JAR=$(find build/libs -name '*.jar' -not -name '*-sources.jar' | head -n1)
          [ -n "$JAR" ] || { echo "[ERROR] no jar in build/libs" >&2; exit 1; }

          # The tag names the version the jar was built as, e.g. v1.0.0+26.3
          TAG="${{ github.event.release.tag_name }}"
          case "$JAR" in
            *"-${TAG#v}.jar") ;;
            *) echo "[ERROR] $JAR does not match the tag $TAG, check mod_version and minecraft" >&2; exit 1 ;;
          esac

          gh release upload "$TAG" "$JAR" --clobber

      - name: Publish to the marketplace
        if: github.event_name == 'release' && !github.event.release.prerelease && vars.MARKETPLACE_ITEM_ID != ''
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ITEM_ID: ${{ vars.MARKETPLACE_ITEM_ID }}
          VERSION: ${{ github.event.release.tag_name }}
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          set -euo pipefail

          JAR=$(find build/libs -name '*.jar' -not -name '*-sources.jar' | head -n1)
          [ -n "$JAR" ] || { echo "[ERROR] no jar in build/libs" >&2; exit 1; }

          # The client unpacks a revision and expects exactly one jar at its root.
          zip -j addon.zip "$JAR"

          # --form-string: -F would read a release body starting with @ as a file path.
          curl --fail-with-body -X POST \
            "https://api.liquidbounce.net/api/v3/marketplace/$ITEM_ID/revisions" \
            -H "Authorization: Bearer $API_TOKEN" \
            -F "file=@addon.zip" \
            --form-string "version=$VERSION" \
            --form-string "changelog=$CHANGELOG"

  gametest:
    needs: natives
    runs-on: ubuntu-latest
    # A client that fails to start or hangs must not hold the runner for hours
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setting up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Download the Linux library
        uses: actions/download-artifact@v7
        with:
          name: natives-linux-x64
          path: natives
      # The game renders through Mesa's EGL; the page is drawn by WebKitGTK
      - name: Install Xvfb, EGL and WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libegl-mesa0 libwebkit2gtk-4.1-0
      - name: Run game tests
        env:
          # Minecraft asks for an sRGB framebuffer, which Xvfb's GLX does not offer
          SDL_VIDEO_FORCE_EGL: 1
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest -Pnatives=natives

      - name: Upload game test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/latest.log
          if-no-files-found: ignore
